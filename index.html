].map(([id,it,ru,d])=>{const f=(s,k)=>s.split("\n").filter(Boolean).map(l=>{const p=l.split("|"),o={i:p[0],r:p[1]};if(k===1)o.b=1;if(k===2)o.b=1;return o});return{id,it,ru,w:f(d).concat(B[id]?f(B[id],1):[]).concat(E[id]?f(E[id],2):[])}});

let known={};try{known=JSON.parse(localStorage.getItem("cils-known")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("cils-known",JSON.stringify(known))}catch(e){}};
const app=document.getElementById("app");
let mode="all";
const inMode=x=>mode==="all"||(mode==="b1")===!!x.b;
const pool=t=>t.w.filter(inMode);
const left=t=>pool(t).filter(x=>!known[x.i]);
let topic=null,q=[],pos=0,shown=false;

function home(){
  topic=null;
  const all=T.reduce((a,t)=>a+pool(t).length,0),rest=T.reduce((a,t)=>a+left(t).length,0);
  app.innerHTML=`<h1>CILS B1 Cittadinanza</h1><p class="sub">Выучено ${all-rest} из ${all}. Выбери тему:</p>
  <div class="bar"><i style="width:${(all-rest)/all*100}%"></i></div><div class="row tabs">${[["all","Все слова"],["core","Основные"],["b1","B1"]].map(([k,l])=>`<button class="tab${mode===k?" on":""}" data-k="${k}">${l}</button>`).join("")}</div><button class="t2" id="dc">Словарь: все слова</button><div class="grid">`+
  T.filter(t=>pool(t).length).map(t=>`<button class="t" data-id="${t.id}"><span><b>${t.it}</b><small>${t.ru}</small></span><span class="n">${left(t).length}/${pool(t).length}</span></button>`).join("")+
  `</div><p><button class="link" id="rs">Сбросить весь прогресс</button></p>`;
  app.querySelectorAll(".t").forEach(b=>b.onclick=()=>start(b.dataset.id));
  document.getElementById("dc").onclick=()=>{flt="all";dict()};
  app.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{mode=b.dataset.k;home()});
  const rs=document.getElementById("rs");let armed=false;rs.onclick=()=>{if(!armed){armed=true;rs.textContent="Точно сбросить? Нажми ещё раз";rs.style.color="var(--r)";setTimeout(()=>{armed=false;rs.textContent="Сбросить весь прогресс";rs.style.color=""},4000)}else{known={};save();home()}};
}
function start(id){
  topic=T.find(t=>t.id===id);
  q=left(topic).sort(()=>Math.random()-.5);pos=0;shown=false;card();
}
function card(){
  const hd=`<div class="top"><button class="link" id="bk">← Темы</button><span class="sub">${topic.it}</span></div>`;
  if(pos>=q.length){
    const n=left(topic).length;
    app.innerHTML=hd+`<div class="card"><div class="w">${n?"Круг окончен":"Тема выучена! 🎉"}</div>${n?`<div class="sub">Осталось неизвестных слов: ${n}</div>`:""}</div>`+
    (n?`<div class="row"><button class="b ok" id="again">Ещё круг</button></div>`:"");
    document.getElementById("bk").onclick=home;
    const a=document.getElementById("again");if(a)a.onclick=()=>start(topic.id);return;
  }
  const c=q[pos];
  app.innerHTML=hd+`<div class="bar"><i style="width:${pos/q.length*100}%"></i></div>
  <div class="card"><div class="w">${c.i}</div>${shown?`<div class="tr">${c.r}</div>`:""}<div class="sub">${pos+1} / ${q.length}</div><div class="sub">← не знаю · знаю →</div></div>
  <div class="row">${shown?`<button class="b nx" id="nx">Дальше</button>`:`<button class="b no" id="dk">Не знаю</button><button class="b ok" id="kn">Знаю</button>`}</div>`;
  document.getElementById("bk").onclick=home;
  const f=(id,fn)=>{const e=document.getElementById(id);if(e)e.onclick=fn};
  const know=()=>{known[c.i]=1;save();pos++;shown=false;card()};
  const dont=()=>{shown=true;card()};
  const next=()=>{pos++;shown=false;card()};
  f("kn",know);f("dk",dont);f("nx",next);
  const cd=app.querySelector(".card");let sx=null,dx=0;
  cd.onpointerdown=e=>{sx=e.clientX;dx=0;cd.style.transition="none";try{cd.setPointerCapture(e.pointerId)}catch(_){}};
  cd.onpointermove=e=>{if(sx===null)return;dx=e.clientX-sx;cd.style.transform=`translateX(${dx}px) rotate(${dx/25}deg)`;cd.style.borderColor=dx>20?"var(--g)":dx<-20?"var(--r)":""};
  const end=()=>{if(sx===null)return;const d=dx;sx=null;if(d>90)know();else if(d<-90)(shown?next():dont());else{cd.style.transition="transform .2s";cd.style.transform="";cd.style.borderColor=""}};
  cd.onpointerup=end;cd.onpointercancel=end;
}
let flt="all";
function dict(){
  let h=`<div class="top"><button class="link" id="bk">← Темы</button><span class="sub">Словарь</span></div><div class="row tabs">`+
  [["all","Все"],["no","Не знаю"],["yes","Знаю"]].map(([k,l])=>`<button class="tab${flt===k?" on":""}" data-k="${k}">${l}</button>`).join("")+
  `</div><p class="sub">Красные: не знаю, зелёные: знаю. Нажми на слово, чтобы сменить отметку.</p>`;
  T.forEach((t,ti)=>{
    const ws=t.w.map((x,wi)=>[x,wi]).filter(([x])=>flt==="all"||(flt==="yes")===!!known[x.i]);
    if(!ws.length)return;
    h+=`<h2>${t.it} · ${t.w.filter(x=>known[x.i]).length}/${t.w.length}</h2>`+ws.map(([x,wi])=>`<div class="e ${known[x.i]?"k":"u"}" data-t="${ti}" data-w="${wi}"><b>${x.i}${x.b?" <small>B1</small>":""}</b><span>${x.r}</span></div>`).join("");
  });
  const y=window.scrollY;app.innerHTML=h;window.scrollTo(0,y);
  document.getElementById("bk").onclick=home;
  app.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{flt=b.dataset.k;dict()});
  app.querySelectorAll(".e").forEach(e=>e.onclick=()=>{const w=T[e.dataset.t].w[e.dataset.w];if(known[w.i])delete known[w.i];else known[w.i]=1;save();dict()});
}
home();
